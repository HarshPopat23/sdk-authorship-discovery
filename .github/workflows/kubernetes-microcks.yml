name: Kubernetes SDK Microcks verification

on:
  pull_request:
    paths:
      - .github/workflows/kubernetes-microcks.yml
      - authorship/kubernetes-go-microcks-demo/**
  push:
    branches: [main]
    paths:
      - .github/workflows/kubernetes-microcks.yml
      - authorship/kubernetes-go-microcks-demo/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-microcks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: authorship/kubernetes-go-microcks-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: authorship/kubernetes-go-microcks-demo/go.sum
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
      - name: Acquire pinned runtime and inputs
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          go mod download all
          python prepare.py
          python setup_runtime.py
      - name: Verify SDK requests against real Microcks traces
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOWORK: "off"
          GOFLAGS: "-mod=readonly -buildvcs=false"
          CGO_ENABLED: "0"
        run: |
          go test -count=1 ./...
          python -m unittest -v test_evidence.py
          python prepare.py --check
          go vet ./...
          go mod verify
          python verify.py
